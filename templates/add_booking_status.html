<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900|Roboto+Slab:400,700" />
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>

    <title>The Alpha World</title>
    <style>
        .navbar {
            background: rgba(236, 139, 2, 0.9);
        }
        .navbar-brand img {
            height: 50px;
            width: auto;
        }
        .navbar-nav .nav-item .nav-link {
            color: rgba(60, 88, 94, 0.9);
            font-size: 18px;
            padding: 10px 20px 10px 20px;
        }
        .navbar-nav .nav-item .nav-link:hover {
            background: rgba(60, 88, 94, 0.6);
            color: white;
            border-radius: 10px;
        }
        .active {
            background: rgba(60, 88, 94, 0.6) !important;
            color: #fff !important;
            border-radius: 10px;
        }
        .logout-btn {
            background: rgba(60, 88, 94, 0.9);
            border-radius: 10px;
            color: white;
        }
        .logout-btn:hover {
            background: rgba(60, 88, 94, 0.6);
            color: white;
            border-radius: 10px;
        }
        .dropdown-menu {
            background: rgba(236, 139, 2, 0.9);
            top: 100%;
            left: auto !important;
            right: 0 !important;
            margin-top: 5px;
        }
        .dropdown-menu .dropdown-item {
            color: rgba(60, 88, 94, 0.9);
        }
        .dropdown-menu .dropdown-item:hover {
            background: rgba(60, 88, 94, 0.6);
            color: white !important;
        }

        .carousel-inner .carousel-caption h5, p {
            /*color: rgba(60, 88, 94, 0.9);*/
            color: black;
        }

        .booking_event_card {
            background: rgba(60, 88, 94, 0.91);
            border-radius: 20px;
            transition: transform 0.3s;
            box-shadow: 3px 3px 5px #888888;
        }
        .add_booking_event_btn {
            background: rgba(46, 45, 45, 0.9);
            color: white;
            border-radius: 20px;
        }

        .footer_section {
            position: static;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(236, 139, 2, 0.9);
            text-align: center;
        }
    </style>
</head>
<body>
    <section class="header-section">
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand" href=""><img src="/static/logo_images/Logo.png" alt="logo"></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse ml-4" id="navbarTogglerDemo02">
                <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/home/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/booking/">Bookings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/booking_status/">Guest Status</a>
                    </li>
                    {% if not is_agent %}
                    <li class="nav-item">
                        <a class="nav-link" href="/users/">Users</a>
                    </li>
                    {% endif %}
                </ul>

                <!-- Profile Dropdown -->
                <div class="dropdown position-relative">
                    <button type="button" class="btn my-2 my-sm-0 logout-btn dropdown-toggle" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Profile
                    </button>
                    <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" href="/update_profile/">Profile</a>
                        <a class="dropdown-item" href="/logout/">Log Out</a>
                    </div>
                </div>
            </div>
        </nav>
    </section>

<!--  add booking status section -->
    <section class="add_booking_status_section">
        <div>
            {% if error %}
                <div style="z-index: 9999;" class="col-md-12 alert alert-danger alert-dismissible mx-auto position-absolute top-0 start-0 end-0" role="alert">
                    {{ error }}
                    <span style="float: right; cursor: pointer; font-size: 20px;" aria-hidden="true" onclick="this.parentElement.style.display='none';">&times;</span>
                </div>
            {% endif %}
            {% if success %}
                <div style="color: white; z-index: 9999;" class="col-md-12 alert alert-success alert-dismissible mx-auto position-absolute top-0 start-0 end-0" role="alert">
                    {{ success }}
                    <span style="float: right; cursor: pointer; font-size: 20px;" aria-hidden="true" onclick="this.parentElement.style.display='none';">&times;</span>
                </div>
            {% endif %}
        </div>

        <div class="row m-0">
            <div class="col-md-5 mx-auto my-4">
                <div class="card booking_event_card">
                    <div class="card-body">
                        <h4 class="font-weight-bolder text-center mt-2 mb-4">Update Status</h4>
                        <form method="post" action="/add_booking_status/{{ data_id }}/{{ day_id }}/" enctype="multipart/form-data">
                            <div class="input-group input-group-outline my-3">
                                <input type="text" name="agent_name" placeholder="Agent Name" value="{{ admin_data.name }}" class="form-control" required>
                            </div>
                            <div class="input-group input-group-outline my-3">
                                <input type="text" name="booking_title" placeholder="Booking Title" class="form-control" required>
                            </div>
                            <div class="input-group input-group-outline mb-3">
                                <input type="file" name="images" placeholder="Images" class="form-control" multiple required>
                            </div>
                            <div class="input-group input-group-outline mb-3">
                                <textarea name="description" placeholder="Description" class="form-control" rows="4" required></textarea>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn w-50 my-4 mb-2 add_booking_event_btn">Add Status</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

<!--        footer section -->
    <footer class="footer_section">
        <div class="container pt-2">
            <hr style="border: 1px solid gray;">
            <div class="row m-0" style="height: 40px;">
                <div class="col-md-12">
                    <div class="copyright text-center text-sm text-muted text-lg-start">
                    © 2025, Create by <a class="font-weight-bold">CodeBase</a> for a better web.
                  </div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
          var errorAlerts = document.querySelectorAll(".alert-danger");
          var successAlerts = document.querySelectorAll(".alert-success");

          errorAlerts.forEach(function (errorAlert) {
              setTimeout(function () {
                  errorAlert.style.display = "none";
              }, 2000);
          });

          successAlerts.forEach(function (successAlert) {
              setTimeout(function () {
                  successAlert.style.display = "none";
              }, 2000);
          });
        });
    </script>

</body>
</html>
